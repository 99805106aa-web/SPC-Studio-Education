# Copy into Streamlit Cloud > App settings > Secrets. Never commit real keys.
SPC_EDUCATION_MODE = true
# Optional override. Existing local administrator credentials are preserved;
# otherwise the same 7-digit default as the MSA app is used.
# SPC_ADMIN_PASSWORD = "replace-with-a-private-password"
# Omit this key to manage the date in the sidebar.
# SPC_ALLOWED_DATE = "2026-11-20"
# Optional: set the actual deployed public app URL. Cloud also detects it automatically.
# SPC_PUBLIC_URL = "https://your-real-app.streamlit.app"
# GEMINI_API_KEY = "..."
# GROQ_API_KEY = "..."
# OPENROUTER_API_KEY = "..."
